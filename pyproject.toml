[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-valuation-intelligence"
version = "0.1.0"
description = "A provenance-aware knowledge engineering framework for financial valuation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FVI Contributors" }]
dependencies = [
  "jsonschema>=4.21,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7,<5",
  "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
